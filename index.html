      {title: "從歷史紀錄快速新增", items: ["在清單內點新增商品按鈕，選擇「從歷史紀錄」。", "輸入商品名稱搜尋，點選要再次購買的商品。", "確認帶入的資料、調整本次單價與數量後儲存。側邊選單的「歷史紀錄」也可查看先前存入的商品。"], tip: "歷史紀錄保存的是商品資料，並非每次結帳的交易明細。"},
      {title: "編輯資料與查看圖片", items: ["點一下商品資訊，開啟編輯畫面，修改名稱、單價、折扣或數量。", "點編輯畫面中的商品圖片，可拍照或從照片圖庫更換圖片；修改後按「確定」。", "在清單中點商品圖片，可放大查看，再按關閉返回。"], tip: "價格由你輸入與維護，搜尋結果不會自動更新清單中的單價。"},
      {title: "標記已購買與計算花費", items: ["將商品向右滑動到出現完成提示後放開，切換已購買狀態；再次向右滑動可恢復未購買。", "清單頂端會更新已購買／未購買的商品項目數，以及已購買商品的總花費。", "向左滑動商品可刪除；清除按鈕可選擇只清除已完成項目，或清除所有項目。"], tip: "總花費只計入已購買商品，依單價 ×（1 − 折扣百分比 ÷ 100）× 數量加總。商品項目數是清單列數，不是數量欄的總和。"},
      {title: "查詢商品價格", items: ["長按商品資訊，開啟以商品名稱與「價格」為關鍵字的 Google 搜尋。", "查看相關商品與商家的資訊，返回清單後，可點商品自行修改單價。"], tip: "搜尋結果提供查詢參考，實際價格仍以商家與結帳資訊為準。"},
      {title: "設定購買提醒", items: ["在清單上方開啟「購買提醒」，設定「提醒週期（天）」與「目標數量」，再按「確定」。建議輸入 1 以上的整數。", "允許 App 發送通知。當未購買的商品項目數達到目標後，App 會依設定的天數週期提醒。", "未購買項目低於目標，或關閉該清單的購買提醒時，會取消該清單的提醒。"], tip: "例如目標 3、週期 2 天：清單有至少 3 項未購買商品時，開始安排每 2 天一次的提醒。這是週期提醒，不是指定日期或時間的鬧鐘。"},
      {title: "備份至 iCloud 與還原", items: ["先在裝置登入 iCloud 並啟用相關功能，再從側邊選單進入「設定」。", "選擇「備份至 iCloud」，閱讀確認訊息後按「確定」，等待完成提示。備份包含購物清單與歷史紀錄資料。", "要取回備份時，選擇「從 iCloud 還原」，確認後等待還原完成提示。若沒有備份資料，App 會顯示提示。"], tip: "備份會覆蓋 iCloud 中既有的備份；還原會以備份取代目前裝置內的資料。請先確認要保留哪一份。這是手動備份與還原。"},
      {title: "切換語言與重新顯示教學", items: ["從側邊選單進入「設定」，點「語言」，選擇想使用的 App 語言。", "若想重新查看 App 內的操作提示，選擇「重置教學說明」，下次進入相關頁面時會再次顯示。"], tip: "網站頁首的語系切換只影響網站；App 的顯示語言需在 App 內設定。"},

      {title: "从历史记录快速添加", items: ["在清单内点击添加商品按钮，选择「从历史记录」。", "输入商品名称搜索，点击要再次购买的商品。", "确认带入的信息、调整本次单价与数量后保存。侧边菜单的「历史记录」也可查看先前存入的商品。"], tip: "历史记录保存的是商品信息，并非每次结账的交易明细。"},

      {title: "查询商品价格", items: ["长按商品信息，打开以商品名称与「价格」为关键词的 Google 搜索。", "查看相关商品与商家的信息，返回清单后，可点击商品自行修改单价。"], tip: "搜索结果提供查询参考，实际价格仍以商家与结账信息为准。"},
      {title: "设置购买提醒", items: ["在清单上方打开「购买提醒」，设置提醒周期（天）与目标数量，再按「确定」。建议输入 1 以上的整数。", "允许 App 发送通知。当未购买的商品项目数达到目标后，App 会按设置的天数周期提醒。", "未购买项目低于目标，或关闭该清单的购买提醒时，会取消该清单的提醒。"], tip: "例如目标 3、周期 2 天：清单有至少 3 项未购买商品时，开始安排每 2 天一次的提醒。这是周期提醒，不是指定日期或时间的闹钟。"},

  en: {
    title: "ShopperPro guide",
    intro: "Create your first list, scan products, track spending and set restocking reminders—one step at a time.",
    card: "Learn to create lists, scan and choose images, add items, mark purchases, set reminders and back up to iCloud.",
    scope: "Based on the 1.2.0 workflow in ShopperPro Ads. ShopperPro paid edition 1.2.0 is currently under review. Older versions may have different screens and scanning steps.",
    contents: "Jump to an operation",
    step: "Step",
    note: "Good to know",
    archive: "See the original features and earlier screens",
    help: "Need help? Contact us",
    steps: [
      {title: "Create and manage shopping lists", items: ["Open Shopping list from the side menu. Tap the add button, enter a list name and tap OK. Create separate lists for stores, household supplies or different purposes.", "Tap a list to open its items. Swipe left on a list to edit its name or delete it.", "A green checkmark appears beside the list when all of its items are marked as purchased."], tip: "Deleting a list also deletes every item in it. Check before confirming."},
      {title: "Add an item manually", items: ["Open a list, tap the add-item button and choose Manual input.", "Enter the product name, unit price, discount percentage and quantity, then tap Confirm. A product name is required.", "Tap the product image and choose From Camera or From Photo Library to add your own photo."], tip: "Discount is the percentage taken off the price. A unit price of 100, discount of 20 and quantity of 2 give a subtotal of 160. Enter 0 for no discount."},
      {title: "Scan a barcode and choose a product image", items: ["Tap the add-item button and choose Scan barcode. Allow camera access and place the product barcode inside the scanning frame.", "If the barcode is already in your history, the app reuses the saved product information. For a new barcode, it opens Google Images so you can choose a result.", "Find a suitable product view, tap Capture image, drag a rectangle around the product and tap Use selected image. Use Back to results if you need to choose again.", "Choose a product name from the recognized text or type one yourself. Check the image and name before saving. You can then edit the unit price, discount and quantity in the list."], tip: "Search requires an internet connection. Check the selected image and recognized text. If no suitable result is available, close the search and use Manual input."},
      {title: "Add an item from history", items: ["In a list, tap the add-item button and choose From the history records.", "Search by product name and tap the item you want to buy again.", "Check the imported details, adjust the price and quantity for this purchase and save. History records in the side menu also lets you view previously saved products."], tip: "History stores product information, rather than a receipt or transaction record for every checkout."},
      {title: "Edit details and view photos", items: ["Tap an item's details to edit its name, unit price, discount or quantity.", "Tap the image in the edit form to take a photo or choose a replacement from your photo library. Tap Confirm to save.", "Tap an image in the list to enlarge it, then close the image to return."], tip: "You enter and maintain prices yourself. Search results do not automatically update the unit price in your list."},
      {title: "Mark purchases and track spending", items: ["Swipe an item right until the completion cue appears, then release to toggle its purchased status. Swipe right again to mark it as not purchased.", "The top of the list updates the purchased and unpurchased item counts, along with the total spent on purchased items.", "Swipe an item left to delete it. The clear button lets you clear completed items or all items."], tip: "The total includes purchased items only: unit price × (1 − discount percentage ÷ 100) × quantity. Item counts refer to rows in the list, not the sum of their quantities."},
      {title: "Look up product prices", items: ["Long-press an item's details to open a Google search using its name and the word price.", "Browse product and retailer information. Return to the list and tap the item if you want to update its unit price."], tip: "Search results are a reference. Check the retailer's current price and checkout total."},
      {title: "Set purchase reminders", items: ["Turn on Buy reminder at the top of a list. Enter the Reminder cycle (days) and Target quantity, then tap Confirm. Use positive whole numbers.", "Allow notifications. When the number of unpurchased item rows reaches the target, the app schedules reminders at the chosen interval.", "The list's reminder is cancelled when its unpurchased item count falls below the target or you turn off Buy reminder."], tip: "For a target of 3 and a cycle of 2 days, at least 3 unpurchased items trigger a reminder every 2 days. This is an interval reminder, rather than an alarm for a specific date or time."},
      {title: "Back up to iCloud and restore", items: ["Sign in to iCloud on your device and enable its relevant features, then open Settings from the side menu.", "Choose Backup to iCloud, read the confirmation and tap Confirm. Wait for the completion message. The backup contains shopping lists and history records.", "To retrieve a backup, choose Restore from iCloud, confirm and wait for the completion message. The app tells you if no backup is available."], tip: "Backing up overwrites the existing iCloud backup. Restoring replaces the data currently on your device with the backup. Check which copy you want to keep. Backup and restore are manual operations."},
      {title: "Change language and show tips again", items: ["Open Settings from the side menu, tap Language and select your preferred app language.", "Choose Reset instruction to see the app's operation tips again the next time you enter the relevant pages."], tip: "The language selector at the top of this website changes the website only. Change the app's language in its own settings."},
    ],
  },
};

function guideGallery(locale, images, fallbackCaption) {
  const text = SITE_COPY[locale];
  if (!images.length) return "";
  return `<div class="guide-gallery">${images.map((image, index) => {
    const size = GUIDE_IMAGE_SIZES[image.src] || image;
    const dimensions = size.width && size.height ? `width="${size.width}" height="${size.height}"` : "";
    const caption = image.caption || `${fallbackCaption} ${index + 1}`;
    return `<figure><button class="guide-image-button" type="button" data-guide-image="${escapeArchive(image.src)}" data-guide-caption="${escapeArchive(caption)}" aria-label="${text.enlarge}: ${escapeArchive(caption)}"><img decoding="async" src="${publicAssetUrl(escapeArchive(image.src))}" alt="${escapeArchive(caption)}" ${dimensions} loading="lazy" /></button><figcaption>${escapeArchive(caption)} · ${text.imageHint}</figcaption></figure>`;
  }).join("")}</div>`;
}

function shopperGuideGallery(locale, id) {
  const screens = SHOPPER_GUIDE_MEDIA[locale]?.[id] || [];
  return guideGallery(locale, screens, SITE_COPY[locale].screenshot);
}

function accountGuideChaptersView(locale, c) {
  const text = SITE_COPY[locale];
  const guide = LEGACY_GUIDE[locale];
  const m = MIGRATION_COPY[locale];
  const chapters = [];
  const history = [];
  const chapterIds = ["login", "categories", "quick-login", "generator", "settings"];
  for (const block of ARCHIVE_GUIDE[locale]) {
    if (/^h[1-4]$/.test(block.type)) {
      if (/1\.(2\.1|1\.0|0\.1)/.test(block.text)) history.push(block);
      else chapters.push({title: block.text, blocks: []});
    } else if (chapters.length) chapters[chapters.length - 1].blocks.push(block);

function bindGuideImages(locale) {
  let dialog = document.getElementById("guide-image-dialog");
  if (!dialog) {
    dialog = document.createElement("dialog");
    dialog.id = "guide-image-dialog";
    dialog.className = "guide-image-dialog";
    document.querySelector(".site-shell").append(dialog);
    dialog.addEventListener("click",event => { if(event.target === dialog) dialog.close(); });
  }
  document.querySelectorAll("[data-guide-image]").forEach(button => button.addEventListener("click",() => {
    const text = SITE_COPY[locale];
    const path = button.dataset.guideImage;
    const caption = button.dataset.guideCaption;
    dialog.setAttribute("aria-label",caption);
    dialog.innerHTML = `<div class="guide-image-toolbar" role="group" aria-label="${text.zoomControls}"><button type="button" data-guide-zoom="out" aria-label="${text.zoomOut}" disabled>−</button><output class="guide-zoom-level" aria-label="${text.zoomLevel}" aria-live="polite">—</output><button type="button" data-guide-zoom="in" aria-label="${text.zoomIn}" disabled>＋</button><button type="button" data-guide-zoom="fit" disabled>${text.fitImage}</button><button class="guide-image-close" type="button" aria-label="${text.close}" autofocus>${icon("close")}</button></div><div class="guide-image-stage" tabindex="0" aria-label="${text.panImage}"><figure><img decoding="async" loading="eager" fetchpriority="high" src="${publicAssetUrl(escapeArchive(path))}" alt="${escapeArchive(caption)}" /></figure></div><p class="guide-image-caption">${escapeArchive(caption)}</p>`;
    const image = dialog.querySelector("img");
    const thumbnail = button.querySelector("img");
    const stage = dialog.querySelector(".guide-image-stage");
    const zoomOut = dialog.querySelector('[data-guide-zoom="out"]');
    const zoomIn = dialog.querySelector('[data-guide-zoom="in"]');
    const fit = dialog.querySelector('[data-guide-zoom="fit"]');
    const level = dialog.querySelector(".guide-zoom-level");
    let referenceWidth = 1, fitWidth = 1, currentWidth = 1, minimumWidth = 1, maximumWidth = 1;
    let mode = "initial";
    function measure() {
      const ratio = image.naturalWidth / image.naturalHeight;
      const rect = thumbnail.getBoundingClientRect();
      // Thumbnail object-fit can leave empty space inside its element box.
      // Compare actual painted pixels, not the width of that box.
      referenceWidth = Math.max(1, Math.min(rect.width, rect.height * ratio));
      fitWidth = Math.max(1, Math.min(stage.clientWidth, stage.clientHeight * ratio));
      minimumWidth = Math.max(1, Math.min(fitWidth, referenceWidth) / 2);
      maximumWidth = Math.max(fitWidth, referenceWidth * 1.5) * 4;
    }
    function draw(width, preserveCenter = false) {
      const old = image.getBoundingClientRect();
      const view = stage.getBoundingClientRect();
      const centerX = old.width ? (view.left + stage.clientWidth / 2 - old.left) / old.width : .5;
      const centerY = old.height ? (view.top + stage.clientHeight / 2 - old.top) / old.height : .5;
      currentWidth = Math.max(minimumWidth, Math.min(maximumWidth, width));
      image.style.width = `${currentWidth}px`;
      level.textContent = `${Math.round(currentWidth / referenceWidth * 100)}%`;
      zoomOut.disabled = currentWidth <= minimumWidth + 1;
      zoomIn.disabled = currentWidth >= maximumWidth - 1;
      fit.disabled = false;
      if (preserveCenter) {
        const next = image.getBoundingClientRect();
        stage.scrollLeft += next.left + next.width * centerX - view.left - stage.clientWidth / 2;
        stage.scrollTop += next.top + next.height * centerY - view.top - stage.clientHeight / 2;
      } else {
        stage.scrollLeft = Math.max(0, (stage.scrollWidth - stage.clientWidth) / 2);
        stage.scrollTop = 0;
      }
    }
    function initialize() {
      if (!image.naturalWidth || !image.naturalHeight || !dialog.open) return;
      measure();
      // Low-resolution originals must still open larger than their thumbnails.
      // If that exceeds the viewport, the stage scrolls instead of shrinking.
      draw(Math.max(fitWidth, referenceWidth * 1.5));
    }
    zoomIn.addEventListener("click", () => { mode = "custom"; draw(currentWidth * 1.25, true); });
    zoomOut.addEventListener("click", () => { mode = "custom"; draw(currentWidth / 1.25, true); });
    fit.addEventListener("click", () => { mode = "fit"; measure(); draw(fitWidth); });
    dialog.querySelector(".guide-image-close").addEventListener("click", () => dialog.close());
    const resize = () => {
      if (!image.naturalWidth || !dialog.open) return;
      const scale = currentWidth / referenceWidth;
      measure();
      draw(mode === "fit" ? fitWidth : mode === "initial" ? Math.max(fitWidth, referenceWidth * 1.5) : referenceWidth * scale, true);
    };
    window.addEventListener("resize", resize);
    dialog.addEventListener("close", () => window.removeEventListener("resize", resize), { once: true });
    dialog.showModal();
    if (image.complete && image.naturalWidth) initialize();
    else image.addEventListener("load", initialize, { once: true });
  }));
}

// One controller for the shared button; page renders only reset its state.
function createBackToTop(button) {
  const idleDelay = 2000;
  let idleTimer;
  let lastScrollAt = 0;
  let hasScrolled = false;

  function position() {
    const page = document.documentElement;
    const y = Math.max(0, window.scrollY);
    const end = Math.max(0, page.scrollHeight - page.clientHeight);
    return { atTop: y <= 2, atBottom: end > 2 && y >= end - 2 };
  }

  function blocked() {
    return Boolean(document.querySelector('dialog[open], .main-nav.open'));
  }

  function clearIdle() {
    window.clearTimeout(idleTimer);
    idleTimer = undefined;
  }

  function refresh() {
    clearIdle();
    const { atTop, atBottom } = position();
    if (atTop || blocked()) {
      if (atTop && document.activeElement === button) {
        document.getElementById('app').focus({ preventScroll: true });
      }
      button.hidden = true;
      return;
    }
    if (atBottom) {
      button.hidden = false;
      return;
    }
    const remaining = hasScrolled ? idleDelay - (Date.now() - lastScrollAt) : 0;
    button.hidden = remaining <= 0;
    if (remaining > 0) idleTimer = window.setTimeout(refresh, remaining);
  }

  window.addEventListener('scroll', () => {
    hasScrolled = true;
    lastScrollAt = Date.now();
    refresh();
  }, { passive: true });
  window.addEventListener('resize', refresh, { passive: true });

  // Dialogs, the mobile menu and late layout changes can alter whether the
  // button belongs on screen, even without a document scroll event.
  if (typeof MutationObserver !== 'undefined') {
    new MutationObserver(refresh).observe(document.querySelector('.site-shell'), {
      subtree: true, attributes: true, attributeFilter: ['open', 'class'],
    });
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(refresh).observe(document.body);
  }

  button.addEventListener('click', () => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduced ? 'instant' : 'smooth' });
  });

  return {
    reset() {
      hasScrolled = false;
      lastScrollAt = 0;
      refresh();
    },
  };
}

function storedLocale() {
  try {
    const value = localStorage.getItem("slaiac-locale");
    return LOCALES.includes(value) ? value : null;
  } catch {
    return null;
  }
}

function saveLocale(locale) {
  try { localStorage.setItem("slaiac-locale", locale); } catch { /* Private browsing can disable storage. */ }
}

function detectLocale() {
  const preferred = navigator.languages?.length ? navigator.languages : [navigator.language || ""];
  for (const value of preferred) {
    const locale = value.toLowerCase();
    if (/^zh(?:-|$)/.test(locale)) {
      if (/(hans|cn|sg)/.test(locale)) return "zh-Hans";
      if (/(hant|tw|hk|mo)/.test(locale)) return "zh-Hant";
      return "zh-Hant";
    }
    if (/^en(?:-|$)/.test(locale)) return "en";
  }
  return "en";
}

function currentLocation() {
  const match = location.hash.match(/^#\/(zh-Hant|zh-Hans|en)(?:\/(.*))?$/);
  if (match) return { locale: match[1], route: (match[2] || "").replace(/^\/+|\/+$/g, "") };
  const locale = storedLocale() || detectLocale();
  history.replaceState(null, "", `#/${locale}/`);
  return { locale, route: "" };
}

function url(locale, route = "") { return `#/${locale}/${route}`; }
function navLink(locale, route, label, active) { return `<a href="${url(locale, route)}"${active ? ' aria-current="page"' : ""}>${label}</a>`; }
function externalLink(urlValue, label, kind = "button-primary") { return `<a class="${kind}" href="${urlValue}" target="_blank" rel="noopener noreferrer">${label} ${icon("arrowUpRight")}</a>`; }

function renderHeader(locale, route, c) {
  const m = MIGRATION_COPY[locale];
  const nav = [
    ["", c.nav.home], ["products", c.nav.products], ["updates", c.nav.updates], ["guides", c.nav.guides], ["about", c.nav.about], ["contact", m.contact],
  ];
  document.getElementById("site-header").innerHTML = `
    <div class="header-inner">
      <a class="brand" href="${url(locale)}" aria-label="SLAIAC studio · ${c.nav.home}">
        <img decoding="async" src="${publicAssetUrl("assets/slaiac-logo.png")}" alt="" width="47" height="47" loading="eager" fetchpriority="high" />
        <span class="brand-text"><strong>SLAIAC</strong><small>studio</small></span>
      </a>
      <nav class="main-nav${state.menuOpen ? " open" : ""}" id="main-nav" aria-label="${c.menuLabel}">
        ${nav.map(([path, label]) => navLink(locale, path, label, path ? route === path || route.startsWith(`${path}/`) : route === "")).join("")}
      </nav>
      <div class="header-controls">
        <label class="language-label">${icon("globe")}
          <span class="sr-only">${c.languageLabel}</span>
          <select class="language-select" id="language-select" aria-label="${c.languageLabel}">
            <option value="zh-Hant"${locale === "zh-Hant" ? " selected" : ""}>繁體中文</option>
            <option value="zh-Hans"${locale === "zh-Hans" ? " selected" : ""}>简体中文</option>
            <option value="en"${locale === "en" ? " selected" : ""}>English</option>
          </select>
        </label>
        <button class="menu-toggle" id="menu-toggle" aria-label="${state.menuOpen ? c.closeMenuLabel : c.menuLabel}" aria-expanded="${state.menuOpen}" aria-controls="main-nav">${icon(state.menuOpen ? "close" : "menu")}</button>
      </div>
    </div>`;
  document.getElementById("language-select").addEventListener("change", event => {
    const next = event.target.value;
    if (!LOCALES.includes(next)) return;
    saveLocale(next);
    state.menuOpen = false;
    location.hash = url(next, route);
  });
  document.getElementById("menu-toggle").addEventListener("click", () => {
    state.menuOpen = !state.menuOpen;
    document.getElementById("main-nav").classList.toggle("open", state.menuOpen);

    toggle.setAttribute("aria-label", c.menuLabel);
    toggle.innerHTML = icon("menu");
  }));
}

function escapeArchive(value) {
  return value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderArchiveBlocks(blocks, locale, articleId = "") {
  let html = "";
  let images = [];
  const flushImages = () => {
    if (!images.length) return;
    html += `<div class="archive-media-grid">${images.map(image => `<figure class="${/search_login_icon|check_button|appicon|pb_logo/.test(image.src) ? "archive-small-media" : ""}"><img decoding="async" src="${publicAssetUrl(escapeArchive(image.src))}" alt="${escapeArchive(image.alt || MIGRATION_COPY[locale].historicalImage)}" loading="lazy" /></figure>`).join("")}</div>`;
    images = [];
  };
  for (const block of blocks) {
    if (block.type === "img") { images.push(block); continue; }
    flushImages();
    const value = escapeArchive(block.text);
    if (/^h[1-4]$/.test(block.type)) {
      const match = block.text.match(/1\.(2\.1|1\.0|0\.1)/);
      const route = match ? ({ "2.1": "accountbox-121", "1.0": "accountbox-110", "0.1": "accountbox-101" })[match[1]] : null;
      const heading = block.type === "h2" || block.type === "h3" ? "h2" : "h3";
      html += route ? `<${heading}><a href="${url(locale, `updates/${route}`)}">${value} ${icon("arrowUpRight")}</a></${heading}>` : `<${heading}>${value}</${heading}>`;
    } else {
      let content = value;
      if (articleId.startsWith("shopper-") && /^(免費版本下載連結|付費版本下載連結|Free version download link|Paid version download link)/.test(block.text)) {
        const paid = /^(付費|Paid)/.test(block.text);
        const href = paid ? "https://itunes.apple.com/us/app/shopperpro-create-your-shopping-list/id1250816554?mt=8" : "https://itunes.apple.com/us/app/shopperpro-ad-create-your-shopping-list/id1250823790?mt=8";
        content = `<a href="${href}" target="_blank" rel="noopener noreferrer">${value} ${icon("arrowUpRight")}</a>`;
      } else if (articleId === "accountbox-101" && /^(密碼盒操作說明|AccountBox Instruction)/.test(block.text)) {
        content = `<a href="${url(locale, "guides/accountbox")}">${value} ${icon("arrowUpRight")}</a>`;
      }
      html += `<p class="${block.type === "li" ? "archive-list-line" : "archive-copy"}">${content}</p>`;
    }
  }
  flushImages();
  return `<div class="archive-content">${html}</div>`;
}

  return `${pageHero(locale, c, c.guidesEyebrow, c.guidesTitle, c.guidesIntro)}<section class="container section"><div class="guide-grid"><a class="guide-entry" href="${url(locale, "guides/accountbox")}"><span class="eyebrow">ACCOUNTBOX</span><h2>${m.guideCardTitle}</h2><p>${m.guideCardText}</p><span class="inline-link">${m.viewGuide} ${icon("arrowRight")}</span></a><a class="guide-entry" href="${url(locale, "guides/shopperpro")}"><span class="eyebrow">SHOPPERPRO · 1.2.0</span><h2>${guide.title}</h2><p>${guide.card}</p><span class="inline-link">${m.viewGuide} ${icon("arrowRight")}</span></a></div></section><div class="section-divider"></div><section class="container section"><div class="section-top"><div><span class="eyebrow">FAQ</span><h2 class="section-title">${c.guideFaqTitle}</h2></div></div><div class="faq-list">${c.faqs.map(item => `<details><summary>${item.q}${icon("plus")}</summary><p>${item.a}</p></details>`).join("")}</div></section>`;
}

function shopperGuideView(locale, c) {
  const guide = SHOPPER_GUIDE[locale];
  const m = MIGRATION_COPY[locale];
  const sectionId = index => `shopper-guide-${SHOPPER_GUIDE_IDS[index]}`;
  return `${pageHero(locale, c, "SHOPPERPRO · 1.2.0", guide.title, guide.intro, [[c.nav.guides, "guides"], ["ShopperPro", null]])}<article class="container shopper-guide"><p class="archive-notice">${guide.scope}</p><nav class="guide-toc" aria-label="${guide.contents}"><h2>${guide.contents}</h2><div class="guide-toc-grid">${guide.steps.map((step, index) => `<button type="button" data-guide-section="${sectionId(index)}"><span>${String(index + 1).padStart(2, "0")}</span>${step.title} ${icon("arrowRight")}</button>`).join("")}</div></nav>${guide.steps.map((step, index) => `<section class="shopper-guide-step" id="${sectionId(index)}" tabindex="-1"><div class="guide-step-number" aria-hidden="true">${String(index + 1).padStart(2, "0")}</div><div><h2>${step.title}</h2><ol>${step.items.map(item => `<li>${escapeArchive(item)}</li>`).join("")}</ol>${shopperGuideGallery(locale, SHOPPER_GUIDE_IDS[index])}<aside class="guide-tip"><strong>${guide.note}</strong><p>${escapeArchive(step.tip)}</p></aside></div></section>`).join("")}<div class="article-foot"><a class="button-secondary" href="${url(locale, "guides")}">${m.returnGuide} ${icon("arrowRight")}</a><a class="button-quiet" href="${url(locale, "products/shopperpro")}">${c.returnProduct} ${icon("arrowUpRight")}</a><a class="button-quiet" href="${url(locale, "contact")}">${guide.help} ${icon("arrowUpRight")}</a></div><div class="resource-links"><a href="${url(locale, "updates/shopper-launch")}">${guide.archive} ${icon("arrowRight")}</a></div></article>`;
}

function accountGuideView(locale, c) {
  return accountGuideChaptersView(locale, c);
}

function privacyView(locale, c) {
  const m = MIGRATION_COPY[locale];
  return `${pageHero(locale, c, "PRIVACY ARCHIVE", m.policyTitle, m.policyIntro)}<section class="container section"><p class="archive-notice">${LEGACY_POLICIES[locale].notice}</p><div class="policy-grid"><a class="guide-entry" href="${url(locale, "privacy/accountbox")}"><span class="eyebrow">2017-03-05 · ACCOUNTBOX</span><h2>${m.policyAccount}</h2><span class="inline-link">${m.viewGuide} ${icon("arrowRight")}</span></a><a class="guide-entry" href="${url(locale, "privacy/shopperpro")}"><span class="eyebrow">2019-01-31 · SHOPPERPRO</span><h2>${m.policyShopper}</h2><span class="inline-link">${m.viewGuide} ${icon("arrowRight")}</span></a></div></section>`;
}

function policyDetailView(locale, c, product) {
  if (!["accountbox", "shopperpro"].includes(product)) return notFoundView(locale, c);
  const m = MIGRATION_COPY[locale];
  const policy = LEGACY_POLICIES[locale];
  const title = product === "accountbox" ? m.policyAccount : m.policyShopper;
  const date = product === "accountbox" ? "2017-03-05" : "2019-01-31";
  const paragraphs = ARCHIVE_POLICIES[product][locale];
  const body = paragraphs.map(paragraph => {
    const parts = paragraph.split(/\n\s*\n/);
    const heading = /^\d+\./.test(parts[0]) && parts.length > 1;
    return `<section class="policy-section">${heading ? `<h2>${escapeArchive(parts.shift())}</h2>` : ""}<p>${parts.map(escapeArchive).join("<br><br>")}</p></section>`;
  }).join("");
  return `${pageHero(locale, c, "PRIVACY ARCHIVE", title, policy.notice, [[m.privacy, "privacy"], [product === "accountbox" ? "AccountBox" : "ShopperPro", null]])}<article class="container article-body"><p class="article-meta">${m.policyDate}: <time datetime="${date}">${date}</time></p>${body}<div class="article-foot"><a class="button-secondary" href="${url(locale, "privacy")}">${m.privacy} ${icon("arrowRight")}</a>${externalLink(LEGACY_POLICY_SOURCES[product], m.policySource, "button-quiet")}</div></article>`;
}

function contactView(locale, c) {
  const m = MIGRATION_COPY[locale];
  const options = [
    ["", m.subjectPlaceholder], ["ShopperPro feedback", m.subjectShopper], ["AccountBox feedback", m.subjectAccount],
    ["Suggestion", m.subjectSuggestion], ["Conversation", m.subjectChat], ["Other", m.subjectOther],
  ];
  return `${pageHero(locale, c, "CONTACT SLAIAC STUDIO", m.contactTitle, m.contactIntro)}
    <section class="container section contact-layout">
      <div class="contact-panel"><h2>${m.contactFormTitle}</h2>
        <form class="contact-form" id="contact-form" action="https://api.web3forms.com/submit" method="POST" accept-charset="UTF-8">
          <input type="hidden" name="access_key" value="5038de14-d839-459d-8987-b2c54e641b8f" />
          <input type="hidden" name="subject" value="SLAIAC Studio website contact" />
          <input class="form-honey" type="checkbox" name="botcheck" tabindex="-1" aria-hidden="true" />
          <div class="form-grid">
            <label>${m.name}<input type="text" name="name" autocomplete="name" maxlength="120" required /></label>
            <label>${m.email}<input type="email" name="email" autocomplete="email" maxlength="254" required /></label>
          </div>
          <div class="form-grid">
            <label>${m.subject}<select name="topic" required>${options.map(([value, label]) => `<option value="${value}"${value ? "" : " disabled selected"}>${label}</option>`).join("")}</select></label>
            <label>${m.website}<input type="url" name="website" autocomplete="url" maxlength="300" /></label>
          </div>
          <label>${m.message}<textarea name="message" rows="8" minlength="10" maxlength="10000" required></textarea></label>
          <p class="form-note">${m.privacyNote}</p>
          <div class="form-status" id="form-status" role="status" aria-live="polite"></div>
          <button class="button-primary" type="submit">${m.send} ${icon("arrowUpRight")}</button>
        </form>
      </div>
      <aside class="contact-aside"><span class="eyebrow">EMAIL</span>
        <a class="contact-email" href="mailto:SLAIAC.SERVICE@gmail.com">SLAIAC.SERVICE@gmail.com</a>
        <p>${m.sendingNote}</p>
        <a class="inline-link" href="mailto:SLAIAC.SERVICE@gmail.com">${m.directEmail} ${icon("arrowUpRight")}</a>
      </aside>
    </section>`;
}

function aboutView(locale, c) {
  return studioAboutView(locale, c);
}

function notFoundView(locale, c) {
  return `${pageHero(locale, c, "404", c.notFoundTitle, c.notFoundText)}<section class="container section"><a class="button-primary" href="${url(locale)}">${c.backHome} ${icon("arrowRight")}</a></section>`;
}

function bindPageActions(locale, c) {
  document.querySelectorAll(".teaser-reveal").forEach(button => button.addEventListener("click", () => {
    const clue = document.getElementById(`clue-${button.dataset.clue}`);
    clue.hidden = !clue.hidden;
    button.setAttribute("aria-expanded", String(!clue.hidden));
    button.innerHTML = `${clue.hidden ? c.reveal : c.hide} ${icon("arrowRight")}`;
  }));
  bindEditionActions(locale, c);
  bindContactActions(locale);
}

function bindContactActions(locale) {
  const form = document.getElementById("contact-form");
  if (!form) return;
  const m = MIGRATION_COPY[locale];
  const status = document.getElementById("form-status");
  const button = form.querySelector('button[type="submit"]');
  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (!form.reportValidity()) return;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 12000);
    button.disabled = true;
    status.className = "form-status";
    status.textContent = m.sending;
    try {
      const payload = Object.fromEntries(new FormData(form));
      const response = await fetch(form.action, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify(payload),
        signal: controller.signal,
      });
      const data = await response.json();
      if (!response.ok || data.success !== true) throw new Error("Form delivery was not confirmed");
      form.reset();
      status.className = "form-status form-success";
      status.innerHTML = `<h3>${m.sentTitle}</h3><p>${m.sentText}</p>`;
    } catch {
      const fields = new FormData(form);
      const emailSubject = ["SLAIAC Studio", fields.get("topic")].filter(Boolean).join(" · ");
      const emailBody = [
        `${m.name}: ${fields.get("name") || ""}`,
        `${m.email}: ${fields.get("email") || ""}`,
        `${m.website}: ${fields.get("website") || ""}`,
        "",
        String(fields.get("message") || ""),
      ].join("\n");
      const emailLink = `mailto:SLAIAC.SERVICE@gmail.com?subject=${encodeURIComponent(emailSubject)}&body=${encodeURIComponent(emailBody)}`;
      status.className = "form-status form-error";
      status.innerHTML = `<p>${m.sendError}</p><div class="form-fallback"><a href="${emailLink}">${m.directEmail} ${icon("arrowUpRight")}</a><a href="https://slaiac.wordpress.com/contact/" target="_blank" rel="noopener noreferrer">${m.oldContact} ${icon("arrowUpRight")}</a></div>`;
    } finally {
      clearTimeout(timeout);
      button.disabled = false;
    }
  });
}

function bindEditionActions(locale, c) {
  document.querySelectorAll(".edition-tab").forEach(button => {
    if (button.dataset.bound) return;
    button.dataset.bound = "true";
    button.addEventListener("click", () => {
      state.edition = button.dataset.edition;
      const area = document.getElementById("edition-area");
      area.innerHTML = editionMarkup(locale, c);
      bindEditionActions(locale, c);
      area.querySelector(`[data-edition="${state.edition}"]`)?.focus();
    });
    button.addEventListener("keydown", event => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      const next = state.edition === "ads" ? "paid" : "ads";
      document.querySelector(`#edition-area [data-edition="${next}"]`)?.click();
    });
  });
}

function render() {
  const { locale, route } = currentLocation();
  const c = CONTENT[locale];
  const m = MIGRATION_COPY[locale];
  document.documentElement.lang = locale;
  document.title = c.metaTitle;
  renderHeader(locale, route, c);
  const app = document.getElementById("app");
  if (route === "") app.innerHTML = homeView(locale, c);
  else if (route === "products") app.innerHTML = productsView(locale, c);
  else if (route === "products/accountbox") app.innerHTML = accountView(locale, c);
  else if (route === "products/shopperpro") app.innerHTML = shopperView(locale, c);
  else if (route === "updates") app.innerHTML = updatesView(locale, c);
  else if (route.startsWith("updates/")) app.innerHTML = articleView(locale, c, route.slice(8));
  else if (route === "guides") app.innerHTML = guidesView(locale, c);
  else if (route === "guides/accountbox") app.innerHTML = accountGuideView(locale, c);
  else if (route === "guides/shopperpro") app.innerHTML = shopperGuideView(locale, c);
  else if (route === "privacy") app.innerHTML = privacyView(locale, c);
  else if (route.startsWith("privacy/")) app.innerHTML = policyDetailView(locale, c, route.slice(8));
  else if (route === "contact") app.innerHTML = contactView(locale, c);
  else if (route === "about") app.innerHTML = aboutView(locale, c);
  else app.innerHTML = notFoundView(locale, c);
  document.getElementById("site-footer").innerHTML = studioFooterView(locale, c);
  bindPageActions(locale, c);
  bindGuideImages(locale);
  document.querySelectorAll("[data-guide-section]").forEach(button => {
    button.addEventListener("click", () => {
      const section = document.getElementById(button.dataset.guideSection);
      section?.scrollIntoView({ behavior: "auto", block: "start" });
      section?.focus({ preventScroll: true });
    });
  });
  if (state.lastRoute !== null && state.lastRoute !== route) window.scrollTo({ top: 0, behavior: "auto" });
  state.lastRoute = route;
  bindBackToTop(locale);
}

window.addEventListener("hashchange", () => {
  state.menuOpen = false;
  render();
});
render();

</script>
</body>
</html>
